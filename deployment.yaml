
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-placement-portal-app
  labels:
    app: student-placement-portal-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-placement-portal-app
  template:
    metadata:
      labels:
        app: student-placement-portal-app
    spec:
      containers:
        - name: student-placement-portal
          image: jaisshaurya/student-placement-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: student-placement-portal-app-service
spec:
  type: NodePort
  selector:
    app: student-placement-portal-app
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
      nodePort: 30085
